name: Generate post thumbnails

on:
  push:
    branches-ignore:
      - main
    paths:
      - "content/posts/**.md"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  thumbnail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find posts without a thumbnail
        id: find
        run: |
          files=$(grep -L '^thumbnail:' content/posts/*.md || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Install thumbnail dependencies
        if: steps.find.outputs.files != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          pip install pillow google-genai

      - name: Generate thumbnails
        if: steps.find.outputs.files != ''
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "${{ steps.find.outputs.files }}" | while read -r f; do
            [ -z "$f" ] && continue
            python3 scripts/generate_thumbnail.py "$f"
          done

      - name: Commit generated thumbnails
        if: steps.find.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/images/posts content/posts
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add generated thumbnail(s)"

          branch="${GITHUB_REF#refs/heads/}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$branch"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest $branch and retrying..."
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              git rebase --abort
              echo "Rebase failed, aborting" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to push generated thumbnails after retries" >&2
          exit 1
