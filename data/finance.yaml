# 금융·세금 계산기가 쓰는 기준 수치
#
# ⚠️ 주간 점검 Routine이 관리한다. 수치가 바뀌면 글이 아니라 여기를 고친다.
#
# 검증 이력
#   2026-10-21  대출 한도·배당소득 계산기 도입에 맞춰 신설

current_year: 2026

# ── 스트레스 DSR ──────────────────────────────────────────────────
# 2026년 7월 1일 ~ 12월 31일: 수도권·규제지역 3단계, 지방 2단계 유지
stress_dsr:
  지역_순서: ["수도권·규제지역", "그 외 지역(지방)"]
  지역:
    "수도권·규제지역":
      단계: "3단계"
      스트레스금리: 0.030
      기본적용비율: 1.00
    "그 외 지역(지방)":
      단계: "2단계"
      스트레스금리: 0.015
      기본적용비율: 0.50
  주택외대출:                  # 신용대출·기타대출은 지역 구분 없이 동일
    스트레스금리: 0.015
    기본적용비율: 1.00
  dsr_순서: ["은행권 40%", "제2금융권 50%"]
  dsr_한도:
    "은행권 40%": 0.40
    "제2금융권 50%": 0.50

# ── 정책대출 금리 (비교용 참고값) ─────────────────────────────────
policy_loan_rates:
  순서: ["신생아특례대출", "일반 디딤돌대출", "소상공인 직접대출", "소상공인 대리대출"]
  구간:
    신생아특례대출: [0.016, 0.033]
    일반 디딤돌대출: [0.033, 0.0415]
    소상공인 직접대출: [0.02, 0.02]
    소상공인 대리대출: [0.0385, 0.0385]

# ── 배당소득 과세 ─────────────────────────────────────────────────
dividend_tax:
  원천징수세율: 0.14            # 2,000만 원까지
  종합과세_기준: 20000000       # 이자·배당 합계가 이 금액을 넘으면 종합과세 대상
  지방소득세율: 0.10            # 산출세액의 10%
  분리과세_구간:                # [상한(원), 세율] — 상한 null은 초과 전부
    - [20000000, 0.14]
    - [300000000, 0.20]
    - [5000000000, 0.25]
    - [null, 0.30]
  종합과세_한계세율_순서: ["6% (과표 1,400만 이하)", "15% (~5,000만)", "24% (~8,800만)", "35% (~1.5억)", "38% (~3억)", "40% (~5억)", "42% (~10억)", "45% (10억 초과)"]
  종합과세_한계세율:
    "6% (과표 1,400만 이하)": 0.06
    "15% (~5,000만)": 0.15
    "24% (~8,800만)": 0.24
    "35% (~1.5억)": 0.35
    "38% (~3억)": 0.38
    "40% (~5억)": 0.40
    "42% (~10억)": 0.42
    "45% (10억 초과)": 0.45

# ── 주택 취득세 ───────────────────────────────────────────────────
# 계산기(/tools/acquisition-tax-calculator/)가 쓴다.
# 무주택·1주택 유상취득만 다룬다. 다주택 중과(조정지역 2주택 8%, 3주택 이상 12%)와
# 증여·상속·원시취득은 범위 밖이므로 계산기에서 안내만 한다.
acquisition_tax:
  세율_6억이하: 0.01
  세율_9억초과: 0.03
  구간_하한: 600000000           # 6억 — 이 아래는 1% 고정
  구간_상한: 900000000           # 9억 — 이 위는 3% 고정
  # 6억~9억 구간 세율 = (취득가액 × 2 ÷ 3억 − 3) ÷ 100, 소수점 5자리에서 반올림
  구간_분모: 300000000
  구간_배수: 2
  구간_차감: 3
  세율_반올림_자리: 5
  지방교육세_비율: 0.10          # 취득세액의 1/10 (= 세율 0.1~0.3%)
  농특세율: 0.002                # 전용 85㎡ 초과만 과세. 국민주택규모 이하는 비과세
  농특세_면제_전용면적: 85
  생애최초_감면:
    한도_일반: 2000000
    한도_인구감소지역: 3000000
    주택가격_상한: 1200000000    # 실거래가 12억 초과면 감면 불가
  출산양육_감면_한도: 5000000
  신고납부_기한_일: 60

# ── 퇴직금·퇴직소득세 ──────────────────────────────────────────────
# 계산기(/tools/retirement-tax-calculator/)가 쓴다.
# 출처: 국세청 퇴직소득 안내(cntntsId=7880), 소득세법 제48조(개정 2022-12-31,
# 2023-01-01 이후 퇴직분부터 적용)·제55조.
# finance.yaml은 연도로 감싸지 않는다 (welfare.yaml과 관례가 다름).
retirement_tax:
  # 근속연수공제: [근속연수 상한(null=무한), 기준연수, 기본공제액, 초과 1년당 공제액]
  근속연수공제:
    - [5,    0,  0,        1000000]
    - [10,   5,  5000000,  2000000]
    - [20,   10, 15000000, 2500000]
    - [null, 20, 40000000, 3000000]
  # 환산급여공제: [환산급여 상한(null=무한), 하한, 기본공제액, 초과분 공제율]
  환산급여공제:
    - [8000000,   0,         0,         1.00]
    - [70000000,  8000000,   8000000,   0.60]
    - [100000000, 70000000,  45200000,  0.55]
    - [300000000, 100000000, 61700000,  0.45]
    - [null,      300000000, 151700000, 0.35]
  # 기본세율(소득세법 제55조): [과세표준 상한(null=무한), 세율, 누진공제액]
  기본세율:
    - [14000000,   0.06, 0]
    - [50000000,   0.15, 1260000]
    - [88000000,   0.24, 5760000]
    - [150000000,  0.35, 15440000]
    - [300000000,  0.38, 19940000]
    - [500000000,  0.40, 25940000]
    - [1000000000, 0.42, 35940000]
    - [null,       0.45, 65940000]
  지방소득세율: 0.10
  # IRP로 이전해 연금으로 받으면 이연퇴직소득세가 감면된다.
  # 21년차 이후 50% 감면은 자료마다 시행 시점 설명이 갈려 넣지 않았다.
  수령방식_순서: ["일시금으로 받는다", "연금으로 받는다 (1~10년차)", "연금으로 받는다 (11~20년차)"]
  수령방식_감면율:
    "일시금으로 받는다": 0.00
    "연금으로 받는다 (1~10년차)": 0.30
    "연금으로 받는다 (11~20년차)": 0.40

# ── 청년미래적금 ──────────────────────────────────────────────────
# 계산기(/tools/youth-savings-calculator/)가 쓴다.
# 1차 자료: 금융위원회 보도자료 "청년미래적금 가입절차·심사일정 안내"
#   (fsc.go.kr/no010101/87106) — 연령·병역 미산입·우대형 요건·갈아타기 순서 확인.
# 기여금 비율·월 상한·만기 일시 지급은 금융위 자료에 수치가 없어 2차 자료 기준이다.
# 금리는 은행별·우대조건별로 달라 고정값을 두지 않고 입력으로 받는다.
# 청년도약계좌는 2025-12-31 신규 가입이 종료돼 비교 대상에서 뺐다.
youth_savings:
  만기_개월: 36
  월_납입한도: 500000
  유형_순서: ["우대형 (납입액의 12%)", "일반형 (납입액의 6%)", "기여금 없음"]
  유형:
    "우대형 (납입액의 12%)": {비율: 0.12, 월상한: 60000}
    "일반형 (납입액의 6%)":  {비율: 0.06, 월상한: 30000}
    "기여금 없음":            {비율: 0.00, 월상한: 0}
  기본금리_예시: 5.0           # 2026-03 기준 보도된 기본금리. 은행별로 다르다
  이자소득세_면제: true
  기여금_만기일시지급: true    # 그래서 기여금에는 이자가 붙지 않는다
  우대형_재직요건_개월: 29     # 가입~만기 1개월 전까지 중소기업 재직. 이직 2회까지 허용
