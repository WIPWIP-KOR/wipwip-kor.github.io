# 복지 제도 기준 수치 — 계산기와 글이 공유하는 단일 출처
#
# ⚠️ 주간 점검 Routine이 관리하는 파일이다. 수치가 바뀌면 글 본문이 아니라 여기를 고친다.
#    2027년 1월 1일에 current를 2027로 바꾸면 계산기가 한 번에 전환된다.
#
# 검증 이력
#   2026-10-19  2027년 기준 중위소득 확정분 추가 (+6.70%, 2026-07-28 중앙생활보장위원회)
#   2026-10-21  계산기 도입에 맞춰 data 파일로 분리

current_year: 2026

# ── 기준 중위소득 (월, 원) ─────────────────────────────────────────
# 급여별 선정기준은 이 값에 benefit_ratio를 곱해 산출한다.
median_income:
  2026:
    1: 2564238
    2: 4199292
    3: 5359036
    4: 6494738
    5: 7557656   # 2027년 공표값(8,063,019)에서 역산. 다른 가구원수는 모두 공표값과 일치
    6: 8555952
  2027:
    1: 2736042
    2: 4480645
    3: 5718091
    4: 6929885
    5: 8063019
    6: 9129201

# 7인 이상은 1인 증가마다 아래 금액을 더한다 (6인 − 5인 차액)
median_income_increment:
  2026: 998296
  2027: 1066182

# ── 기초생활보장 급여별 선정기준 (기준 중위소득 대비) ──────────────
benefit_ratio:
  생계급여: 0.32
  의료급여: 0.40
  주거급여: 0.48
  교육급여: 0.50

# ── 그 밖의 "기준 중위소득 대비 %" 문턱 ──────────────────────────
# 소득인정액 계산기 결과 아래에 함께 보여준다. 산식과 재산 기준은 제도마다 다르므로
# 문턱 비교용이라는 단서를 반드시 붙인다. 수치 출처는 각 url의 발행 글(팩트체크 완료).
median_ratio_programs:
  - name: "국민취업지원제도 1유형 (일반)"
    ratio: 0.60
    url: "/posts/2026-08-02-employment-support-program-type1-vs-type2/"
  - name: "한부모가족 복지급여"
    ratio: 0.65
    url: "/posts/2026-07-21-single-parent-family-support-2026-changes/"
  - name: "청소년 한부모 (만 24세 이하)"
    ratio: 0.72
    url: "/posts/2026-07-21-single-parent-family-support-2026-changes/"
  - name: "긴급복지지원 생계지원금"
    ratio: 0.75
    url: "/posts/2026-07-30-emergency-welfare-vs-basic-livelihood-benefit/"
  - name: "국민취업지원제도 2유형"
    ratio: 1.00
    url: "/posts/2026-08-02-employment-support-program-type1-vs-type2/"
  - name: "국민취업지원제도 1유형 (청년 특례)"
    ratio: 1.20
    url: "/posts/2026-08-02-employment-support-program-type1-vs-type2/"

# ── 소득평가액 ────────────────────────────────────────────────────
earned_income_deduction_rate: 0.30   # 근로소득 30% 공제

# ── 재산의 소득환산 ───────────────────────────────────────────────
# 기본재산액은 주거용 → 일반 → 금융 순서로 공제한다 (순서가 결과를 바꾼다)
# 화면 표시 순서. yaml 맵은 가나다순으로 정렬되므로 순서를 따로 둔다.
region_order: ["서울", "경기", "광역시·세종·창원", "그 외 지역"]

basic_property_deduction:
  서울: 99000000
  경기: 80000000
  광역시·세종·창원: 77000000
  그 외 지역: 53000000

# 월 소득환산율
conversion_rate:
  주거용: 0.0104
  일반: 0.0417
  금융: 0.0626
  자동차: 1.0

# ── 부양의무자 기준 ───────────────────────────────────────────────
# 자녀 소득이 영향을 주는지 여부. 계산기 결과 화면에 그대로 노출한다.
supporter_criteria:
  생계급여: "원칙적으로 폐지 (고소득·고재산 부양의무자만 예외)"
  의료급여: "적용 — 자녀 소득을 본다"
  주거급여: "미적용"
  교육급여: "미적용"

# 생계급여 예외 기준선 (개정이 잦아 "알려져 있다" 수준으로만 안내)
supporter_exception:
  annual_income: 130000000
  property: 1200000000

