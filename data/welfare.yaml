    기준연금액: 349700
    부부감액률: 0.20
    최저연금액률: 0.10            # 기준연금액의 10% = 34,970원. 소득역전방지 감액의 하한
    소득평가액_공제: 1160000      # 0.7 × (근로소득 − 116만)
    소득평가액_공제율: 0.70
    금융재산_공제: 20000000       # 기본재산액과 별도로 금융재산에서 2,000만 원 추가 공제
    기본재산액:
      대도시: 135000000
      중소도시: 85000000
      농어촌: 72500000
    기본재산액_순서: ["대도시", "중소도시", "농어촌"]
    재산환산율_연: 0.04           # 월 환산 시 ÷ 12
    연계감액_판정배수: 1.50       # 국민연금 월액이 기준연금액의 150%를 넘으면 연계감액 검토 대상
    가구유형_순서: ["단독가구", "부부가구(둘 다 수급)", "부부가구(배우자 미수급)"]
  note: "2027년 선정기준액·기준연금액은 미발표. 소득 하위 구간 차등 지급안(월 38만 원)과 부부감액률 10% 완화안은 국회 심의 전이다."
  감액_적용순서: "① 국민연금 연계감액 → ② 부부감액 → ③ 소득역전방지 감액. 계산기는 A급여액을 알 수 없어 ①은 판정하지 않고 경고만 띄운다."

