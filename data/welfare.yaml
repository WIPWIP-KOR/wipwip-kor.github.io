# 복지 제도 기준 수치 — 계산기와 글이 공유하는 단일 출처
#
# ⚠️ 주간 점검 Routine이 관리하는 파일이다. 수치가 바뀌면 글 본문이 아니라 여기를 고친다.
#    2027년 1월 1일에 current를 2027로 바꾸면 계산기가 한 번에 전환된다.
#
# 검증 이력
#   2026-10-19  2027년 기준 중위소득 확정분 추가 (+6.70%, 2026-07-28 중앙생활보장위원회)
#   2026-10-21  계산기 도입에 맞춰 data 파일로 분리

current_year: 2026

# ── 기준 중위소득 (월, 원) ─────────────────────────────────────────
# 급여별 선정기준은 이 값에 benefit_ratio를 곱해 산출한다.
median_income:
  2026:
    1: 2564238
    2: 4199292
    3: 5359036
    4: 6494738
    5: 7557656   # 2027년 공표값(8,063,019)에서 역산. 다른 가구원수는 모두 공표값과 일치
    6: 8555952
  2027:
    1: 2736042
    2: 4480645
    3: 5718091
    4: 6929885
    5: 8063019
    6: 9129201

# 7인 이상은 1인 증가마다 아래 금액을 더한다 (6인 − 5인 차액)
median_income_increment:
  2026: 998296
  2027: 1066182

# ── 기초생활보장 급여별 선정기준 (기준 중위소득 대비) ──────────────
benefit_ratio:
  생계급여: 0.32
  의료급여: 0.40
  주거급여: 0.48
  교육급여: 0.50

# ── 소득평가액 ────────────────────────────────────────────────────
earned_income_deduction_rate: 0.30   # 근로소득 30% 공제

# ── 재산의 소득환산 ───────────────────────────────────────────────
# 기본재산액은 주거용 → 일반 → 금융 순서로 공제한다 (순서가 결과를 바꾼다)
# 화면 표시 순서. yaml 맵은 가나다순으로 정렬되므로 순서를 따로 둔다.
region_order: ["서울", "경기", "광역시·세종·창원", "그 외 지역"]

basic_property_deduction:
  서울: 99000000
  경기: 80000000
  광역시·세종·창원: 77000000
  그 외 지역: 53000000

# 월 소득환산율
conversion_rate:
  주거용: 0.0104
  일반: 0.0417
  금융: 0.0626
  자동차: 1.0

# ── 부양의무자 기준 ───────────────────────────────────────────────
# 자녀 소득이 영향을 주는지 여부. 계산기 결과 화면에 그대로 노출한다.
supporter_criteria:
  생계급여: "원칙적으로 폐지 (고소득·고재산 부양의무자만 예외)"
  의료급여: "적용 — 자녀 소득을 본다"
  주거급여: "미적용"
  교육급여: "미적용"

# 생계급여 예외 기준선 (개정이 잦아 "알려져 있다" 수준으로만 안내)
supporter_exception:
  annual_income: 130000000
  property: 1200000000

# ── 교육급여 지급액 (연 1회, 원) ──────────────────────────────────
education_benefit:
  2026:
    초등학생: 502000
    중학생: 699000
    고등학생: 860000

# ── 기초연금 (별도 산식. 자녀 소득·재산을 보지 않는다) ─────────────
basic_pension:
  2026:
    선정기준액:
      단독가구: 2470000
      부부가구: 3952000
    기준연금액: 349700
    부부감액률: 0.20
    소득평가액_공제: 1160000      # 0.7 × (근로소득 − 116만)
    소득평가액_공제율: 0.70
    기본재산액:
      대도시: 135000000
      중소도시: 85000000
      농어촌: 72500000
    재산환산율_연: 0.04           # 월 환산 시 ÷ 12
  note: "2027년 선정기준액·기준연금액은 미발표. 소득 하위 구간 차등 지급안(월 38만 원)은 국회 심의 전이다."

# ── 긴급복지지원 ──────────────────────────────────────────────────
emergency_welfare:
  2026:
    소득기준_중위소득_대비: 0.75
    재산기준:
      대도시: 241000000
      중소도시: 152000000
      농어촌: 130000000
    재산기준_주거용공제_적용시:
      대도시: 310000000
      중소도시: 194000000
    생계지원금:
      1: 783000
      4: 1990000
      6: 2636700
    생계지원금_7인이상_추가: 286900
  note: "2·3·5인 생계지원금은 공표값을 확인하지 못해 비워 둔다. 지역 구분에서 특례시는 대도시다."

# ── 한부모가족 ────────────────────────────────────────────────────
single_parent:
  2026:
    복지급여_소득기준_중위소득_대비: 0.65
    증명서_소득기준_중위소득_대비: 0.65
    청소년한부모_소득기준_중위소득_대비: 0.72
    아동양육비: 230000
    추가아동양육비: 100000
    청소년한부모_아동양육비: 370000
    학용품비_연: 100000
