baseURL = "https://wipwip-kor.github.io/"
languageCode = "ko-kr"
title = "WIPWIP"
paginate = 10
enableEmoji = true
enableRobotsTXT = true
timeZone = "Asia/Seoul"
# 한국어는 공백으로 단어를 나누지 않아 .WordCount/.ReadingTime이 과소 계상된다.
# 이 값을 켜면 Hugo가 CJK 문자를 세어 읽는 시간이 실제와 맞는다.
hasCJKLanguage = true

[params]
  description = "복지 제도의 자격 판정을 직접 계산해 보는 곳. 소득인정액·기초연금 계산기와 제도 비교 글을 제공합니다."
  author = "WIPWIP"
  # 글 바이라인에 쓰는 필명. 소개 페이지와 같은 이름을 써야 한다.
  authorName = "윕윕"
  # 오류 제보용 구글 폼. 이메일은 수집을 피해 소개 페이지에만 둔다.
  contactForm = "https://docs.google.com/forms/d/e/1FAIpQLSehYe-R71u9JF03V3t47vpYsSKu7BTxE_h3Yqe-C2fq3bgkWw/viewform"
  dateFormat = "2006-01-02"
  googleSiteVerification = "yKpNCq_z0Ao2NcpB2k756Vtk9jqlVzz3W3HjACHlsdw"
  # naverSiteVerification: 네이버 서치어드바이저(searchadvisor.naver.com)에서 사이트 등록 시
  # 발급받는 인증 코드를 여기 채우면 head.html이 메타태그를 내보낸다.
  # 2026-11-03 등록. 절차는 scripts/traffic-plan.md에 있다.
  naverSiteVerification = "92c582a78a51e0a87af69c21b30115d7ec878314"
  # bingSiteVerification: Bing 웹마스터 도구(bing.com/webmasters) 인증 코드.
  # Search Console 계정에서 가져오기(Import)가 되므로 코드 없이 등록될 수도 있다.
  # bingSiteVerification = ""
  # googleAdsenseId: AdSense 승인 후 발급받는 "ca-pub-XXXXXXXXXXXXXXXX" 값을
  # 여기 채우면 head.html이 자동으로 인증 메타태그와 광고 스크립트를 내보낸다.
  googleAdsenseId = "ca-pub-5209561911330389"

