baseURL = "https://wipwip-kor.github.io/"
languageCode = "ko-kr"
title = "WIPWIP 연구소"
paginate = 10
enableEmoji = true
enableRobotsTXT = true
timeZone = "Asia/Seoul"
# 한국어는 공백으로 단어를 나누지 않아 .WordCount/.ReadingTime이 과소 계상된다.
# 이 값을 켜면 Hugo가 CJK 문자를 세어 읽는 시간이 실제와 맞는다.
hasCJKLanguage = true

[params]
  description = "AI로 만든 것을 직접 돌려 보고 측정한 기록. 성공담이 아니라 수치와 실패 원인, 틀렸다고 판명된 가정까지 그대로 남깁니다."
  author = "WIPWIP"
  # 글 바이라인에 쓰는 필명. 소개 페이지와 같은 이름을 써야 한다.
  authorName = "윕윕"
  # 오류 제보용 구글 폼. 이메일은 수집을 피해 소개 페이지에만 둔다.
  contactForm = "https://docs.google.com/forms/d/e/1FAIpQLSehYe-R71u9JF03V3t47vpYsSKu7BTxE_h3Yqe-C2fq3bgkWw/viewform"
  dateFormat = "2006-01-02"
  googleSiteVerification = "yKpNCq_z0Ao2NcpB2k756Vtk9jqlVzz3W3HjACHlsdw"
  # naverSiteVerification: 네이버 서치어드바이저(searchadvisor.naver.com)에서 사이트 등록 시
  # 발급받는 인증 코드를 여기 채우면 head.html이 메타태그를 내보낸다.
  # 2026-11-03 등록. 절차는 scripts/traffic-plan.md에 있다.
  naverSiteVerification = "92c582a78a51e0a87af69c21b30115d7ec878314"
  # bingSiteVerification: Bing 웹마스터 도구(bing.com/webmasters) 인증 코드.
  # Search Console 계정에서 가져오기(Import)가 되므로 코드 없이 등록될 수도 있다.
  # bingSiteVerification = ""
  # googleAnalyticsId: GA4 측정 ID("G-XXXXXXXXXX"). 애널리틱스 > 관리 > 데이터 스트림에서
  # 웹 스트림을 만들면 나온다. 비어 있으면 analytics.html이 아무것도 내보내지 않으므로
  # ID를 받기 전에도 빌드가 깨지지 않는다. 운영 빌드에서만 켜진다(hugo.IsProduction).
  googleAnalyticsId = "G-RW5RD2TG34"
  # googleAdsenseId: AdSense 승인 후 발급받는 "ca-pub-XXXXXXXXXXXXXXXX" 값을
  # 여기 채우면 head.html이 자동으로 인증 메타태그와 광고 스크립트를 내보낸다.
  # 2026-11-06 — 애드센스 수익화를 접었으므로 비워 둔다. 값이 비면 head.html이
  # 광고 로더도, google-adsense-account 메타태그도 내보내지 않는다.
  # 개인정보처리방침에 "광고를 게재하지 않습니다"로 적어 뒀으므로 둘을 함께 켜야 한다.
  # googleAdsenseId = "ca-pub-5209561911330389"

[menu]
  [[menu.main]]
    name = "홈"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "기록"
    url = "/posts/"
    weight = 2
  # 2026-11-06 — 계산기 9개가 전부 비공개이므로 메뉴에서 뺐다. 빈 섹션으로 보내는
  # 메뉴 항목을 남겨 둘 이유가 없다. 다시 발행하면 이 블록을 되살린다.
  # [[menu.main]]
  #   name = "계산기"
  #   url = "/tools/"
  #   weight = 3
  [[menu.main]]
    name = "카테고리"
    url = "/categories/"
    weight = 4
  [[menu.main]]
    name = "소개"
    url = "/about/"
    weight = 5

# 사이트 내 검색용 색인. 홈에 추가 출력으로 /search-index.json 을 만든다.
# 외부 검색 서비스(Pagefind 등)를 쓰면 CI에 바이너리를 하나 더 들여야 하고,
# 36개 페이지 규모에서는 Hugo가 만든 JSON 하나로 충분하다.
[outputs]
  home = ["HTML", "RSS", "searchindex"]

[outputFormats]
  [outputFormats.searchindex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  # 본문은 h2만 쓰므로 목차도 h2까지만 모은다.
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
