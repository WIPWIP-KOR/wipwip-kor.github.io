<header class="site-header">
  <div class="wrap">
    <a class="site-brand" href="{{ "/" | relURL }}">
      <span class="site-logo">{{ substr .Site.Title 0 1 }}</span>
      <span class="site-title">{{ .Site.Title }}</span>
    </a>
    <nav class="site-nav">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL | relLangURL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
